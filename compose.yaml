services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ROADSIDE_DATA_DIR: /data
      ROADSIDE_AI_GATEWAY_URL: ${ROADSIDE_AI_GATEWAY_URL:-}
      ROADSIDE_AI_CLIENT_TOKEN: ${ROADSIDE_AI_CLIENT_TOKEN:-}
      ROADSIDE_REPORT_UPLOAD_ENABLED: ${ROADSIDE_REPORT_UPLOAD_ENABLED:-false}
      ROADSIDE_REPORT_UPLOAD_URL: ${ROADSIDE_REPORT_UPLOAD_URL:-}
      ROADSIDE_REPORT_UPLOAD_METHOD: ${ROADSIDE_REPORT_UPLOAD_METHOD:-POST}
      ROADSIDE_REPORT_UPLOAD_API_KEY: ${ROADSIDE_REPORT_UPLOAD_API_KEY:-}
    volumes:
      - roadside-data:/data
volumes:
  roadside-data:
