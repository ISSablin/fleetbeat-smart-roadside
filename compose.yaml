services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ROADSIDE_DATA_DIR: /data
      ROADSIDE_AI_GATEWAY_URL: ${ROADSIDE_AI_GATEWAY_URL:-}
      ROADSIDE_AI_CLIENT_TOKEN: ${ROADSIDE_AI_CLIENT_TOKEN:-}
    volumes:
      - roadside-data:/data
volumes:
  roadside-data:
